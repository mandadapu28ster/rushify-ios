name: Release iOS build

# Publish a GitHub release (tag like v0.2.0) and this builds the app and attaches:
#   Rushify-<version>.ipa            unsigned device build, for sideloading with a free Apple ID (Sideloadly, AltStore) or Xcode
#   Rushify-simulator-<version>.zip  simulator build, drag onto an iOS Simulator
on:
  release:
    types: [published]
  workflow_dispatch:   # manual trial run: builds both and keeps them as a workflow artifact

permissions:
  contents: write      # needed to upload files to the release

concurrency:
  group: release-ios-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Work out the version
        id: version
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"; NAME="${TAG#v}"
          else
            TAG="manual-${GITHUB_RUN_NUMBER}"; NAME="0.0.0-manual.${GITHUB_RUN_NUMBER}"
          fi
          MARKETING="${NAME%%-*}"        # CFBundleShortVersionString must be dotted numbers only
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "marketing=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Building $NAME (marketing $MARKETING, build $GITHUB_RUN_NUMBER)"

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Unit tests
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if 'iPhone' in x['name'] and x.get('isAvailable', True)))")
          xcodebuild test -project Rushify.xcodeproj -scheme Rushify -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build/test -only-testing:RushifyTests -quiet

      - name: Build the unsigned device app and package the .ipa
        run: |
          xcodebuild build -project Rushify.xcodeproj -scheme Rushify -configuration Release -sdk iphoneos \
            -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${{ steps.version.outputs.marketing }}" CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" -quiet
          mkdir -p dist/Payload
          cp -R build/device/Build/Products/Release-iphoneos/Rushify.app dist/Payload/
          (cd dist && zip -qry "Rushify-${{ steps.version.outputs.name }}.ipa" Payload && rm -rf Payload)

      - name: Build the simulator app and zip it
        run: |
          xcodebuild build -project Rushify.xcodeproj -scheme Rushify -configuration Release -sdk iphonesimulator \
            -derivedDataPath build/sim MARKETING_VERSION="${{ steps.version.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" -quiet
          ditto -c -k --keepParent build/sim/Build/Products/Release-iphonesimulator/Rushify.app "dist/Rushify-simulator-${{ steps.version.outputs.name }}.zip"

      - name: Checksums
        run: |
          cd dist && shasum -a 256 * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.version.outputs.tag }}" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Keep as a workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Rushify-ios
          path: dist/*
          retention-days: 14
