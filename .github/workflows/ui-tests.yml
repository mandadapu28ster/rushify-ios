name: UI tests

# End-to-end tests: the real app on an iPhone simulator, driven through every screen against canned responses
# (Rushify/UITestFixtures, never a real server). Slow (about 15 minutes), so it runs on demand or on a schedule.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC

permissions:
  contents: read

jobs:
  ui:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: End-to-end tests
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if 'iPhone' in x['name'] and x.get('isAvailable', True)))")
          xcodebuild test -project Rushify.xcodeproj -scheme Rushify -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build -only-testing:RushifyUITests -quiet
      - name: Keep the test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: build/Logs/Test/*.xcresult
          retention-days: 7
