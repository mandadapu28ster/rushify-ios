name: Rushify
options:
  bundleIdPrefix: com.rushify
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Rushify:
    type: application
    platform: iOS
    sources:
      - path: Rushify
        excludes: ["Info.plist"]
    info:
      path: Rushify/Info.plist
      properties:
        CFBundleDisplayName: Rushify
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        # The server is typically a plain http://host:port address that the user types in, so ATS must allow it.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rushify.mobile
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  RushifyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RushifyTests
    dependencies:
      - target: Rushify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rushify.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Rushify:
    build:
      targets:
        Rushify: all
        RushifyTests: [test]
    test:
      targets: [RushifyTests]
